<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Legal documents</title>
<meta name="description" content="The app's Privacy Policy and Terms of Service." />
<style>
  :root {
    --page: #f1ead9;
    --card: #f8f3e7;
    --ink: #2b2823;
    --muted: #8a8071;
    --green: #5e8b5a;
    --hair: #e4d8c0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: 1.9rem; margin: 0 0 1.5rem; text-align: center; letter-spacing: -0.01em; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin: 0 0 0.75rem; }
  a {
    display: block;
    background: var(--card);
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    color: var(--green);
    font-size: 1.1rem;
    text-decoration: none;
  }
  a:hover, a:focus-visible { text-decoration: underline; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #221f1a; --card: #2b2823; --ink: #f1ead9; --muted: #9a9182; --green: #8fbb87; --hair: #3a352d; }
  }
</style>
</head>
<body>
<main>
  <h1>Legal documents</h1>
  <ul>
    <li><a href="./privacy-policy.html">Privacy Policy</a></li>
    <li><a href="./terms.html">Terms of Service</a></li>
  </ul>
</main>
</body>
</html>
